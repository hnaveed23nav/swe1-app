name: Django CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      PYTHONUNBUFFERED: "1"
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 coverage coveralls

      - name: Black (format check)
        run: black --check .

      - name: Flake8 (lint)
        run: |
          echo -e "[flake8]\nmax-line-length = 88\n" > .flake8
          flake8 .

      - name: Django checks (no DB migration)
        run: |
          if [ -f manage.py ]; then python manage.py check; fi

      - name: Run tests with coverage
        run: |
          if [ -f manage.py ]; then
            coverage run manage.py test
          else
            echo "No manage.py found; skipping tests."
          fi
          coverage report -m || true

      - name: Send coverage to Coveralls (optional)
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: coveralls
